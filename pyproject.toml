[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitutor"
version = "0.1.0"
description = "100% local multimodal AI tutor with real-time affective state routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "AiTutor Contributors"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.3",
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.19.0",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
